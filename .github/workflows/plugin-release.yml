name: Release DBX plugin
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run package
      - run: node scripts/release-metadata.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Publish immutable unsigned candidates
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.dbxp dist/*.artifact.json dist/release-candidates.json dist/SHA256SUMS --verify-tag --title "JSON Grid $RELEASE_TAG" --notes-file docs/release-notes.md
