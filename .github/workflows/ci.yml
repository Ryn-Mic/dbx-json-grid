name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          DEBUG: pw:webserver,pw:browser
      - run: npm run package
      - run: node scripts/release-metadata.mjs
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: unsigned-dbx-candidate
          path: dist/
